<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <!-- Responsive Design -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Website Title -->
  <title>DocuMind AI | Smart AI-Powered Document Assistant</title>

  <!-- SEO Meta Tags -->
  <meta
    name="description"
    content="DocuMind AI is your intelligent AI-powered document assistant. Upload, analyze, understand, summarize, and interact with your documents effortlessly."
  />

  <meta
    name="keywords"
    content="DocuMind AI, AI Document Assistant, AI PDF Reader, Document Analysis, PDF Chat, AI Document Summarizer, Smart Document Assistant"
  />

  <meta name="author" content="DocuMind AI" />
  <meta name="robots" content="index, follow" />

  <!-- Theme & Browser Settings -->
  <meta name="theme-color" content="#0f172a" />
  <meta name="color-scheme" content="light dark" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="public/DocuMind.svg" />
  <link rel="apple-touch-icon" href="public/DocuMind.svg" />

  <!-- Open Graph / Facebook / WhatsApp / LinkedIn -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="DocuMind AI | Smart AI Document Assistant" />
  <meta
    property="og:description"
    content="Transform the way you work with documents. Upload, analyze, summarize, and interact with your documents using DocuMind AI."
  />
  <meta property="og:image" content="/DocuMind.png" />

  <!-- Twitter / X Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="DocuMind AI | Smart AI Document Assistant" />
  <meta
    name="twitter:description"
    content="Your intelligent AI-powered document assistant. Analyze and interact with documents effortlessly."
  />
  <meta name="twitter:image" content="/DocuMind.png" />

  <!-- Google Fonts Optimization -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Performance & Security -->
  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <!-- Vite React Application -->
  <script type="module" src="/src/main.tsx"></script>

</head>

<body>

  <!-- React Root -->
  <div id="root"></div>

</body>

</html>
